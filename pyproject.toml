[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "groq",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "pytest-mock",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
