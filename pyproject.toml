[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "groq",
    "joblib",
    "prophet",
    "psycopg2-binary",
    "pydantic>=2",
    "pydantic-settings",
    "pyjwt[crypto]",
    "python-dotenv",
    "scikit-learn",
    "sentence-transformers",
    "sqlalchemy>=2.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "pytest-mock",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
